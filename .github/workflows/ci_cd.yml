name: ci_cd

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: Black check
        run: black --check .
      - name: Isort check
        run: isort --check-only .
      - name: Flake8 check
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi httpx pytest-asyncio pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short

  model-validation:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Validate model
        run: python scripts/validate_model.py
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: evaluation/metrics.json

  docker-build:
    runs-on: ubuntu-latest
    needs: model-validation
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/neurodetect-api
        run: |
          docker buildx build \
            --push \
            --tag "${IMAGE_NAME}:latest" \
            --file app/api/Dockerfile \
            .
      - name: Health check after build
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/neurodetect-api
        run: |
          docker pull "${IMAGE_NAME}:latest"
          docker run -d --rm --name neurodetect-health -p 8000:8000 "${IMAGE_NAME}:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              docker stop neurodetect-health
              exit 0
            fi
            sleep 2
          done
          docker stop neurodetect-health
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/neurodetect-api:latest
            docker-compose up -d
            curl -f http://localhost:8000/health
